<h2 mat-dialog-title>Session expiring</h2>

<mat-dialog-content>
  <p>Your session is about to expire due to inactivity.</p>
  <p class="countdown">
    Logging out in <strong>{{ secondsRemaining }}</strong> second<span *ngIf="secondsRemaining !== 1">s</span>...
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="logoutNow()">Log out</button>
  <button mat-raised-button color="primary" (click)="continueSession()">
    Continue Session
  </button>
</mat-dialog-actions>
